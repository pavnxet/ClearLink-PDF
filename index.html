<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClearLink PDF | Link Remover</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body>
    <div class="glass-bg"></div>
    <div class="container">
        <header>
            <div class="header-text">
                <h1>ClearLink PDF</h1>
                <p>Private, Secure, High-Performance Link Removal</p>
            </div>
        </header>

        <section class="settings">
            <div class="checkbox-group">
                <label class="checkbox-container">
                    <input type="checkbox" id="remove-annots">
                    <span class="checkmark"></span>
                    Remove All Annotations
                </label>
                <label class="checkbox-container">
                    <input type="checkbox" id="scrub-metadata" checked>
                    <span class="checkmark"></span>
                    Scrub Metadata
                </label>
                <label class="checkbox-container">
                    <input type="checkbox" id="remove-bookmarks" checked>
                    <span class="checkmark"></span>
                    Remove Bookmarks
                </label>
                <label class="checkbox-container" title="Files download automatically after processing. Allow multiple downloads in your browser if prompted.">
                    <input type="checkbox" id="auto-download">
                    <span class="checkmark"></span>
                    Auto-Download
                </label>
            </div>
        </section>

        <main>
            <div id="drop-zone" class="drop-zone">
                <div class="drop-content">
                    <div class="icon">📄</div>
                    <h2>Drop PDF files here</h2>
                    <p>or click to browse</p>
                </div>
                <input type="file" id="file-input" multiple accept=".pdf" hidden>
            </div>

            <div id="file-list" class="file-list"></div>
        </main>

        <footer>
            <div id="file-actions" class="footer-buttons" style="display: none;">
                <button id="clear-all-btn" class="btn-secondary">Clear All</button>
                <button id="process-btn" class="btn-primary">Process Files</button>
            </div>
            <div id="overall-progress" class="progress-bar-container" style="display: none;">
                <div class="progress-bar"></div>
            </div>
            <button id="download-all-btn" class="btn-success" style="display: none;" onclick="downloadAll()">⬇ Download All Cleaned Files</button>
            <div id="stats-panel" class="stats-panel" style="display: none;">
                <div class="stat-item">
                    <span class="stat-value" id="stat-processed">0</span>
                    <span class="stat-label">Processed</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="stat-errors">0</span>
                    <span class="stat-label">Errors</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="stat-size-orig">—</span>
                    <span class="stat-label">Original Size</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="stat-size-clean">—</span>
                    <span class="stat-label">Cleaned Size</span>
                </div>
            </div>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
